name: codex-smoke

# The tests against the real pinned Codex SDK. Optional, never a
# required check: it runs a few small Codex turns on the OPENAI_API_KEY secret's account, so it
# runs only when the Codex driver or the test changes, or by hand.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/forge/codex.py
      - src/forge/codex_turn.py
      - src/forge/claude_sdk.py
      - src/forge/claude_turn.py
      - tests/test_claude_agent_sdk_smoke.py
      - tests/test_codex_smoke.py
      - tests/test_codex_runs_skip_host_context.py
      - tests/test_worker_approval_requests.py
      - tests/test_fix_codex_test_home.py
      - tests/conftest.py
      - .github/workflows/codex-smoke.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FORGE_LIVE_CODEX: "1"
      XDG_DATA_HOME: ${{ runner.temp }}/forge-sdk-data
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      # Forge's own installs, as forge doctor --fix runs them: the pinned SDKs in their own environments.
      - run: uv run --python 3.11 python -c "import sys; sys.path.insert(0, 'src'); from forge import claude_sdk, codex; codex.install(); claude_sdk.install()"
      - if: env.OPENAI_API_KEY == ''
        run: echo "::notice::No OPENAI_API_KEY secret here, so the Codex smoke test didn't run."
      # The SDK's own Codex program, logged in with the key.
      - if: env.OPENAI_API_KEY != ''
        run: |
          python="$XDG_DATA_HOME/forge/codex-sdk/openai-codex-0.171.0/bin/python"
          printenv OPENAI_API_KEY | "$("$python" -c 'import codex_cli_bin; print(codex_cli_bin.bundled_codex_path())')" login --with-api-key
      # Uses the real pinned Python SDK and a fake local Claude executable; it makes no API request.
      - run: uv run --python 3.11 pytest tests/test_claude_agent_sdk_smoke.py -v -s
      - if: env.OPENAI_API_KEY != ''
        run: uv run --python 3.11 pytest tests/test_codex_smoke.py tests/test_fix_codex_test_home.py tests/test_worker_approval_requests.py::test_2_builder_runs_forge_test_and_observes_its_failure -v -s
      - if: env.OPENAI_API_KEY != ''
        run: uv run --python 3.11 pytest 'tests/test_codex_runs_skip_host_context.py::test_3_codex_skips_host_context[live]' -v -s
