name: forge-next

# Reuse passed proof on identical release tags.
# Pull requests run related Linux tests in forge.yml; plugin changes also run here.

on:
  pull_request:
    paths:
      - 'src/forge/mod/**'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/forge-next.yml'
  push:
    tags: ['v*']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# A newer pull request run cancels its predecessor; tags, nightly and manual runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: parent-tests
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_WORKFLOW: forge-next.yml
        run: python .github/reuse-test-proof.py
      - uses: actions/setup-node@v4
        if: steps.parent-tests.outputs.reuse != 'true'
        with:
          node-version: '24'
      - run: npm install --global @anthropic-ai/claude-code@2.1.322
        if: steps.parent-tests.outputs.reuse != 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.parent-tests.outputs.reuse != 'true'
      - name: Check and reload the plugin through the repository test entry
        if: steps.parent-tests.outputs.reuse != 'true'
        run: uv run --frozen --python 3.11 pytest tests/test_mod_sync.py -q -k 'native-plugin-checks or real-local-install' -o faulthandler_timeout=120 --timeout=150 --timeout-method=thread
      - name: Check that a real Claude Code session answers /forge
        if: steps.parent-tests.outputs.reuse != 'true'
        run: uv run --frozen --python 3.11 pytest tests/test_pane_session.py -q -o faulthandler_timeout=120 --timeout=150 --timeout-method=thread
      - name: Check that the pane draws real Forge data, including a large test log
        if: steps.parent-tests.outputs.reuse != 'true'
        run: uv run --frozen --python 3.11 pytest tests/test_pane_decision_and_test_output.py -q -o faulthandler_timeout=120 --timeout=150 --timeout-method=thread
